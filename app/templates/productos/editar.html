{% extends "base.html" %}
{% block title %}Editar {{ producto.nombre }}{% endblock %}
{% block content %}
<h1>Editar producto</h1>
<form method="post" enctype="multipart/form-data" class="form-grid">
  <label>Nombre
    <input type="text" name="nombre" value="{{ producto.nombre }}" required>
  </label>
  <label>Marca (opcional)
    <input type="text" name="marca" value="{{ producto.marca or '' }}">
  </label>
  <label>Categoría
    <select name="categoria">
      <option value="ropa" {{ 'selected' if producto.categoria == 'ropa' }}>Ropa</option>
      <option value="suplemento" {{ 'selected' if producto.categoria == 'suplemento' }}>Suplemento</option>
      <option value="otro" {{ 'selected' if producto.categoria == 'otro' }}>Otro</option>
    </select>
  </label>
  <label>Descripción (opcional)
    <textarea name="descripcion" rows="4">{{ producto.descripcion or '' }}</textarea>
  </label>
  <label>Costo (tu inversión por unidad)
    <input type="number" step="0.01" min="0" name="costo" value="{{ producto.costo }}" required>
  </label>
  <label>Precio de venta
    <input type="number" step="0.01" min="0" name="precio_venta" value="{{ producto.precio_venta }}" required>
  </label>
  <label>Stock (opcional)
    <input type="number" min="0" name="stock" value="{{ producto.stock if producto.stock is not none else '' }}">
  </label>
  <label>Reemplazar foto principal (opcional)
    <input type="file" name="imagen" accept="image/*">
  </label>
  <label class="checkbox">
    <input type="checkbox" name="activo" {{ 'checked' if producto.activo }}>
    Producto activo (visible en el catálogo)
  </label>
  <button type="submit" class="btn">Guardar cambios</button>
</form>
{% endblock %}
