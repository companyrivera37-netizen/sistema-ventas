{% extends "base.html" %}
{% block title %}Nuevo producto{% endblock %}
{% block content %}
<h1>Nuevo producto</h1>

<div class="form-grid" style="margin-bottom:16px;">
  <label>Link del producto (Falabella) — opcional
    <input type="url" id="scrape-url" placeholder="https://www.falabella.com.pe/falabella-pe/product/...">
  </label>
  <button type="button" id="scrape-btn" class="btn btn-secundario">Traer datos del link</button>
  <p id="scrape-estado" class="hint"></p>
  <div id="scrape-imagenes" class="fotos" hidden></div>
</div>

<form method="post" enctype="multipart/form-data" class="form-grid" id="form-producto">
  <input type="hidden" name="origen" id="origen" value="manual">
  <input type="hidden" name="url_referencia" id="url_referencia" value="">
  <input type="hidden" name="precio_referencia" id="precio_referencia" value="">

  <label>Nombre
    <input type="text" name="nombre" id="nombre" required>
  </label>
  <label>Marca (opcional)
    <input type="text" name="marca" id="marca">
  </label>
  <label>Categoría
    <select name="categoria" id="categoria">
      <option value="ropa">Ropa</option>
      <option value="suplemento">Suplemento</option>
      <option value="otro" selected>Otro</option>
    </select>
  </label>
  <label>Descripción (opcional)
    <textarea name="descripcion" id="descripcion" rows="4"></textarea>
  </label>
  <label>Costo (tu inversión por unidad)
    <input type="number" step="0.01" min="0" name="costo" id="costo" required>
  </label>
  <label>Precio de venta
    <input type="number" step="0.01" min="0" name="precio_venta" id="precio_venta" required>
  </label>
  <label>Stock (opcional, déjalo vacío si no lo controlas)
    <input type="number" min="0" name="stock">
  </label>
  <label id="campo-imagen-manual">Foto del producto (opcional)
    <input type="file" name="imagen" accept="image/*">
  </label>
  <button type="submit" class="btn">Guardar producto</button>
</form>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/producto_scrape.js') }}" defer></script>
{% endblock %}
