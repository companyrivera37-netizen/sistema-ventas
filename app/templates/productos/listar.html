{% extends "base.html" %}
{% block title %}Productos{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Catálogo de productos</h1>
  <a class="btn" href="{{ url_for('productos.nuevo') }}">+ Nuevo producto</a>
</div>
<div class="galeria-productos">
  {% for p in productos %}
  <button type="button" class="producto-card" onclick="window.location='{{ url_for('productos.detalle', producto_id=p.id) }}'">
    {% if p.imagen_url %}
      <img src="{{ p.imagen_url }}" alt="{{ p.nombre }}">
    {% else %}
      <div class="sin-foto">Sin foto</div>
    {% endif %}
    <div class="producto-card-info">
      <span class="producto-card-nombre">{{ p.nombre }}</span>
      <span class="producto-card-precio">S/ {{ '%.2f'|format(p.precio_venta) }}</span>
    </div>
  </button>
  {% else %}
  <p>Aún no hay productos en el catálogo.</p>
  {% endfor %}
</div>
{% endblock %}
